[project]
name = "financial-markets-digest"
version = "0.1.0"
description = "Console digest of daily financial-market data for a Claude routine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "yfinance>=0.2.66",
    "pandas>=2.3.3",
    "requests>=2.32.0",
]

[project.scripts]
markets-digest = "financial_markets_digest.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.1",
    "ruff>=0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_markets_digest"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "pandas.*", "requests.*"]
ignore_missing_imports = true
